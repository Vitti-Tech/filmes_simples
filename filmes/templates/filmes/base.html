{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Meus filmes{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'filmes/estilo.css' %}">
</head>
<body class="{{ tema }}">

    <form method="post" action="{% url 'alterar_tema' %}">
        {% csrf_token %}
        <button type="submit">Alternar para modo {{ tema_proximo }}</button>
    </form>

    {% block conteudo %}{% endblock %}

</body>
</html>
